name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and linter
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "ruff>=0.5,<0.9"

      - name: Compile Python sources
        run: python -m compileall -q src

      - name: Lint
        run: ruff check src

      - name: Check command-line interface
        run: mmdc-clip-f --help
