schema_version: 1
profile: legacy_protocol
dataset:
  name: DDSM
  data_root: ../../data/ddsm
  image_root: ../../data/ddsm/images
  image_format: jpeg
  expected_counts: {train: 1082, valid: 271, test: 339}
  manifests:
    train: ../../data/ddsm/splits/train.txt
    valid: ../../data/ddsm/splits/valid.txt
    test: ../../data/ddsm/splits/test.txt
model:
  backbone: vit_l_14_336
  hf_model: openai/clip-vit-large-patch14-336
  revision: ce19dc912ca5cd21c8a653c79e251e808ccabcd1
  image_size: 336
  attention_implementation: sdpa
  prompts:
    - almost entirely fatty tissue.
    - scattered areas of dense tissue in the breast.
    - heterogeneously dense.
    - extremely dense throughout.
views:
  input_order: [L_CC, R_CC, L_MLO, R_MLO]
  fusion_pairs:
    - [L_CC, R_CC]
    - [L_MLO, R_MLO]
training:
  epochs: 100
  batch_size: 3
  optimizer:
    name: adam
    learning_rate: 1.0e-7
    weight_decay: 1.0e-5
  loss: cross_entropy
  seed: 42
  num_workers: 8
  amp: false
  deterministic: false
  augmentation:
    name: randaugment
    num_ops: 3
    magnitude: 9
    num_magnitude_bins: 31
  preprocessing:
    resize: [336, 336]
    normalization:
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
selection:
  split: valid
  metric: batch_mean_accuracy
  mode: max
output:
  root: ../../runs/stage1/ddsm-vit-l-14-336

