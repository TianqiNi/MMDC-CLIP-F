[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mmdc-clip-f"
version = "0.1.0"
description = "Training-focused reference implementation of MMDC-CLIP-F"
readme = "README.md"
requires-python = ">=3.10,<3.12"
authors = [
  {name = "Jacob Schaffer"},
  {name = "Wandong Zhang"},
  {name = "Tianqi Ni"},
  {name = "Yimin Yang"},
  {name = "Ameya Madhav Kulkarni"},
  {name = "Ashirbani Saha"},
]
keywords = [
  "mammography",
  "breast-density",
  "multi-view-learning",
  "CLIP",
  "uncertainty",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "numpy>=1.26,<2.1",
  "Pillow>=10.3,<11",
  "pydicom>=2.4,<3.1",
  "PyYAML>=6.0,<7",
  "safetensors>=0.4,<0.6",
  "scikit-learn>=1.5,<1.7",
  "torch>=2.3,<2.4",
  "torchvision>=0.18,<0.19",
  "tqdm>=4.66,<5",
  "transformers>=4.43.4,<4.44",
]

[project.optional-dependencies]
dicom = [
  "pylibjpeg>=2,<3",
  "pylibjpeg-libjpeg>=2,<3",
  "pylibjpeg-openjpeg>=2,<3",
]

[project.scripts]
mmdc-clip-f = "mmdc_clip_f.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

